<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>chattist</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="auth-page chattist-app">
  <div class="reason-bar hidden" id="reason-bar"></div>

  <div class="redirect-overlay hidden" id="redirect-overlay">
    <div class="redirect-box">
      <div class="redirect-icon">&#x2B21;</div>
      <h2 class="redirect-title" id="redirect-title">Welcome!</h2>
      <p class="redirect-sub">Decrypting your vault and preparing your chats...</p>
      <div class="redirect-loader">
        <div class="redirect-loader-fill"></div>
      </div>
    </div>
  </div>

  <div class="auth-container">
    <header class="auth-header">
      <div class="logo"><span class="logo-icon">&#x2B21;</span><span class="logo-text">chattist</span></div>
      <p class="chattist-quote" id="privacy-quote" aria-live="polite"></p>
      <p class="passcode-warn">there is no passcode recovery. remember it or lose the account.</p>
    </header>

    <div class="auth-card">
      <div class="tab-bar">
        <button class="tab active" id="tab-login">Log in</button>
        <button class="tab" id="tab-register">Register</button>
        <div class="tab-indicator" id="tab-indicator"></div>
      </div>

      <div class="form-panel" id="panel-login">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="login-username" class="form-input" placeholder="username" autocomplete="username"/>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrap">
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" autocomplete="current-password"/>
            <button class="eye-btn" id="eye-login" type="button">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="form-msg" id="login-msg"></div>
        <button class="btn-primary" id="btn-login" type="button">Sign in &rarr;</button>
      </div>

      <div class="form-panel" id="panel-register" style="display:none;">
        <div class="form-group">
          <label class="form-label">Choose a username</label>
          <input type="text" id="reg-username" class="form-input" placeholder="username" autocomplete="username"/>
          <span class="form-hint">3–20 chars · lowercase letters, numbers, underscore only</span>
        </div>
        <div class="form-group">
          <label class="form-label">Create a password</label>
          <div class="input-wrap">
            <input type="password" id="reg-password" class="form-input" placeholder="min 8 characters" autocomplete="new-password"/>
            <button class="eye-btn" id="eye-reg" type="button">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm password</label>
          <input type="password" id="reg-confirm" class="form-input" placeholder="Repeat password" autocomplete="new-password"/>
        </div>
        <div class="form-msg" id="reg-msg"></div>
        <button class="btn-primary" id="btn-register" type="button">Create account &rarr;</button>
      </div>

      <div class="auth-footer">
      </div>
    </div>
  </div>

  <script src="js/crypto.js"></script>
  <script src="js/api.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
